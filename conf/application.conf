play.http.secret.key = "changeme"
play.http.secret.key = ${?PLAY_SECRET}

play.http.session {
  cookieName = "makao_staff_web"
  httpOnly = true
  sameSite = "strict"
  secure = false
  secure = ${?MAKAO_SESSION_SECURE}
  maxAge = 8h
}

play.filters.enabled += play.filters.csp.CSPFilter
play.filters.headers {
  frameOptions = "DENY"
  contentTypeOptions = "nosniff"
  referrerPolicy = "no-referrer"
  permittedCrossDomainPolicies = "none"
}
play.filters.csrf {
  cookie.name = "makao_staff_csrf"
  cookie.httpOnly = true
  cookie.sameSite = "strict"
  bypassCorsTrustedOrigins = false
}
play.filters.csp {
  directives {
    default-src = "'none'"
    base-uri = "'none'"
    object-src = "'none'"
    form-action = "'self'"
    frame-ancestors = "'none'"
    img-src = "'self' data:"
    media-src = "'self'"
    style-src = "'self'"
    font-src = "'self'"
    connect-src = "'self'"
  }
}

play.filters.hosts.allowed = ["localhost", "127.0.0.1"]

makao.api.baseUrl = "http://127.0.0.1:8080"
makao.api.baseUrl = ${?MAKAO_API_BASE_URL}
makao.api.requestTimeout = 12s
# Authentication and staff invitations include SMTP submission and database commit.
makao.api.authRequestTimeout = 60s
makao.api.authRequestTimeout = ${?MAKAO_AUTH_REQUEST_TIMEOUT}
makao.staff.sessionHours = 8


